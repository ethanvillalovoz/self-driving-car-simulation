[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "self-driving-car-simulation"
version = "1.1.0"
description = "Reproducible behavioral-cloning pipeline for the Udacity driving simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ethan Villalovoz" }]
keywords = ["behavioral-cloning", "computer-vision", "autonomous-driving", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
simulator = [
  "eventlet>=0.36,<0.41",
  "Flask>=3,<4",
  "python-engineio==3.13.2",
  "python-socketio==4.6.1",
  "tensorflow>=2.16,<2.20",
]
training = [
  "matplotlib>=3.8,<4",
  "tensorflow>=2.16,<2.20",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
self-driving-artifacts = "behavioral_cloning.artifacts:main"
self-driving-drive = "behavioral_cloning.cli:main"
self-driving-train = "behavioral_cloning.train_cli:main"

[project.urls]
Homepage = "https://github.com/ethanvillalovoz/self-driving-car-simulation"
Issues = "https://github.com/ethanvillalovoz/self-driving-car-simulation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"
extend-exclude = ["notebooks/behavioral_cloning.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
