name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts drive.py
          ruff format --check src tests scripts drive.py

      - name: Test
        run: pytest -q

      - name: Validate commands and notebook
        run: |
          python -m behavioral_cloning --help
          self-driving-artifacts --help
          self-driving-train --help
          python -m json.tool notebooks/behavioral_cloning.ipynb >/dev/null
          python -m json.tool examples/original-run-metrics.json >/dev/null
